<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fiesta de Halloween 🎃</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09060d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .invitacion {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 25px 18px;
      text-align: center;

      background:
        radial-gradient(
          circle at top,
          #54206e 0%,
          #160b20 38%,
          #050505 100%
        );
    }

    .luna {
      font-size: 70px;
      margin-top: 10px;
    }

    h1 {
      margin: 10px 0;
      font-size: 42px;
      line-height: 0.95;
      color: #ff6a00;
      text-shadow:
        3px 3px 0 #7a00ff,
        0 0 20px #ff4500;
    }

    .subtitulo {
      font-size: 18px;
      letter-spacing: 3px;
      color: #fff;
    }

    .datos {
      margin: 25px 0;
      padding: 18px;
      border: 2px solid #ff6a00;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.55);
    }

    .dato {
      font-size: 25px;
      font-weight: bold;
      margin: 10px;
    }

    .disfraz {
      background: #ff6a00;
      color: #111;
      padding: 15px;
      border-radius: 14px;
      font-size: 25px;
      font-weight: 900;
      margin: 20px 0;
    }

    .traje {
      font-size: 20px;
      line-height: 1.5;
      margin: 15px 0;
    }

    .ubicacion {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(30, 10, 40, 0.85);
      border: 1px solid #7a00ff;
    }

    .ubicacion h2 {
      color: #ff6a00;
      margin-top: 0;
    }

    .ubicacion p {
      line-height: 1.5;
    }

    /* BOTÓN ASISTIRÉ */

    .boton {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 35px;
      border: none;
      border-radius: 50px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #25D366;
      transition: 0.3s;
    }

    .boton:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px #25D366;
    }

    .nota {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.75;
    }

    /* =========================
       MODAL DEL FORMULARIO
       ========================= */

    .formulario {
      display: none;

      position: fixed;
      z-index: 1000;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: calc(100% - 35px);
      max-width: 430px;

      padding: 30px 25px;

      background:
        linear-gradient(
          145deg,
          #1c0b27,
          #090609
        );

      border: 2px solid #ff6a00;
      border-radius: 25px;

      box-shadow:
        0 0 20px #ff6a00,
        0 0 60px rgba(122, 0, 255, 0.6);

      text-align: center;

      animation: aparecer 0.3s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .formulario h2 {
      margin-top: 0;
      color: #ff6a00;
      font-size: 25px;
      text-shadow: 0 0 10px #ff4500;
    }

    .formulario p {
      color: #ddd;
      font-size: 15px;
      margin-bottom: 20px;
    }

    /* INPUT */

    #nombre {
      width: 100%;

      padding: 15px;

      border-radius: 12px;

      border: 2px solid #7a00ff;

      background: #050505;

      color: white;

      font-size: 17px;

      outline: none;

      text-align: center;

      transition: 0.3s;
    }

    #nombre:focus {
      border-color: #ff6a00;

      box-shadow:
        0 0 10px #ff6a00;
    }

    #nombre::placeholder {
      color: #888;
    }

    /* BOTÓN CONFIRMAR */

    .confirmar {
      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #ff6a00;

      color: #111;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    .confirmar:hover {
      transform: scale(1.03);

      box-shadow:
        0 0 20px #ff6a00;
    }

    /* BOTÓN CANCELAR */

    .cerrar {
      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border: 1px solid #555;

      border-radius: 12px;

      background: transparent;

      color: #aaa;

      font-size: 15px;

      cursor: pointer;
    }

    .cerrar:hover {
      color: white;

      border-color: #ff6a00;
    }

    /* FONDO OSCURO */

    .overlay {
      display: none;

      position: fixed;

      z-index: 999;

      inset: 0;

      background: rgba(0, 0, 0, 0.75);

      backdrop-filter: blur(5px);
    }

    /* MENSAJE DE ÉXITO */

    .exito {
      display: none;

      position: fixed;

      z-index: 1100;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: calc(100% - 35px);
      max-width: 400px;

      padding: 35px 25px;

      background: #100914;

      border: 2px solid #25D366;

      border-radius: 25px;

      box-shadow:
        0 0 30px #25D366;

      text-align: center;

      animation: aparecer 0.3s ease;
    }

    .exito .emoji {
      font-size: 60px;
    }

    .exito h2 {
      color: #25D366;
      margin: 15px 0 10px;
    }

    .exito p {
      color: #ddd;
      line-height: 1.5;
    }

    .cerrar-exito {
      margin-top: 15px;

      padding: 12px 30px;

      border: none;

      border-radius: 30px;

      background: #25D366;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

  </style>
</head>
