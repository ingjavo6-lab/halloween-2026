<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const URL_REGISTRO =
"https://script.google.com/macros/s/AKfycbzF0Q-7I_Wu6oDmbNBnzwtfRnDcJ7_g1ZDEGfbMynK8mVz9bY3vOV-G9WmlluiboKrjLg/exec";

const URL_MAPS =
"https://www.google.com/maps/search/?api=1&query=José+Ma.+Morelos+2%2C+Habitacional%2C+54020+Tlalnepantla%2C+México";

/*
   CAMBIA ESTE NÚMERO POR TU WHATSAPP
*/
const WHATSAPP =
"5618975352";


/* =====================================================
   ELEMENTOS
===================================================== */

const entrada =
document.getElementById("entrada");

const btnEntrar =
document.getElementById("btnEntrar");

const btnMusica =
document.getElementById("btnMusica");

const audio =
document.getElementById("audioHalloween");

const relampago =
document.getElementById("relampago");

const flashRojo =
document.getElementById("flashRojo");

const btnAsistire =
document.getElementById("btnAsistire");

const btnNoAsistire =
document.getElementById("btnNoAsistire");

const btnUbicacion =
document.getElementById("btnUbicacion");

const formulario =
document.getElementById("formulario");

const tituloFormulario =
document.getElementById("tituloFormulario");

const nombreInput =
document.getElementById("nombre");

const codigoInput =
document.getElementById("codigo");

const btnConfirmar =
document.getElementById("btnConfirmar");

const btnCerrar =
document.getElementById("btnCerrar");

const bloqueado =
document.getElementById("bloqueado");

const btnWhatsApp =
document.getElementById("btnWhatsApp");

const resultadoExito =
document.getElementById("resultadoExito");

const resultadoNo =
document.getElementById("resultadoNo");


let tipoConfirmacion = "Sí";


/* =====================================================
   AUDIO
===================================================== */

audio.volume = 0.65;


/* =====================================================
   ENTRAR
===================================================== */

btnEntrar.addEventListener(
"click",
function() {

  entrada.classList.add("oculta");

  reproducirAudio();

});


/* =====================================================
   AUDIO
===================================================== */

function reproducirAudio() {

  audio.currentTime = 0;

  audio.play()
    .then(function() {

      btnMusica.textContent =
      "🔊 AMBIENTE ACTIVADO";

    })
    .catch(function(error) {

      console.log(error);

      btnMusica.textContent =
      "🔊 TOCAR AUDIO";

    });

}


/* =====================================================
   BOTÓN AUDIO
===================================================== */

btnMusica.addEventListener(
"click",
function() {

  if (audio.paused) {

    audio.play();

    btnMusica.textContent =
    "🔊 AMBIENTE ACTIVADO";

  } else {

    audio.pause();

    btnMusica.textContent =
    "🔇 AMBIENTE APAGADO";

  }

});


/* =====================================================
   RELÁMPAGOS
===================================================== */

function relampagoFlash() {

  relampago.classList.remove("activar");
  flashRojo.classList.remove("activar");

  void relampago.offsetWidth;

  relampago.classList.add("activar");

  if (Math.random() > .45) {

    void flashRojo.offsetWidth;

    flashRojo.classList.add("activar");

  }

}


function programarRelampago() {

  const tiempo =
  Math.random() * 7000 + 3500;

  setTimeout(
  function() {

    relampagoFlash();

    programarRelampago();

  },
  tiempo);

}

programarRelampago();


/* =====================================================
   MOSTRAR FORMULARIO
===================================================== */

function abrirFormulario(tipo) {

  tipoConfirmacion = tipo;

  if (tipo === "Sí") {

    tituloFormulario.textContent =
    "🎃 Confirmar asistencia";

  } else {

    tituloFormulario.textContent =
    "👻 Confirmar que no podrás asistir";

  }

  formulario.style.display = "block";
  bloqueado.style.display = "none";
  resultadoExito.style.display = "none";
  resultadoNo.style.display = "none";

  nombreInput.value = "";
  codigoInput.value = "";

  nombreInput.focus();

}


/* =====================================================
   ASISTIRÉ
===================================================== */

btnAsistire.addEventListener(
"click",
function() {

  abrirFormulario("Sí");

});


/* =====================================================
   NO ASISTIRÉ
===================================================== */

btnNoAsistire.addEventListener(
"click",
function() {

  abrirFormulario("No");

});


/* =====================================================
   UBICACIÓN
===================================================== */

btnUbicacion.addEventListener(
"click",
function() {

  window.open(
    URL_MAPS,
    "_blank"
  );

});


/* =====================================================
   CERRAR
===================================================== */

btnCerrar.addEventListener(
"click",
function() {

  formulario.style.display = "none";

  nombreInput.value = "";
  codigoInput.value = "";

});


/* =====================================================
   WHATSAPP
===================================================== */

function prepararWhatsApp(nombre, codigo) {

  const mensaje =
    "Hola, quiero solicitar un cambio en mi respuesta de Halloween 2026.\n\n" +
    "Nombre: " + nombre + "\n" +
    "Código: " + codigo;

  btnWhatsApp.href =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(mensaje);

}


/* =====================================================
   VERIFICAR CÓDIGO CON JSONP
===================================================== */

function verificarCodigo(codigo, callback) {

  const nombreCallback =
    "respuestaCodigo_" + Date.now();

  const script =
    document.createElement("script");

  window[nombreCallback] =
  function(data) {

    delete window[nombreCallback];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    callback(data);

  };

  script.onerror =
  function() {

    delete window[nombreCallback];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    callback({
      bloqueado: false,
      error: true
    });

  };

  script.src =
    URL_REGISTRO +
    "?codigo=" +
    encodeURIComponent(codigo) +
    "&callback=" +
    nombreCallback;

  document.body.appendChild(script);

}


/* =====================================================
   MOSTRAR BLOQUEADO
===================================================== */

function mostrarBloqueado(nombre, codigo) {

  formulario.style.display = "none";

  bloqueado.style.display = "block";

  resultadoExito.style.display = "none";
  resultadoNo.style.display = "none";

  prepararWhatsApp(nombre, codigo);

  bloqueado.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =====================================================
   CONFIRMAR
===================================================== */

btnConfirmar.addEventListener(
"click",
function() {

  const nombre =
    nombreInput.value.trim();

  const codigo =
    codigoInput.value
      .trim()
      .toUpperCase();


  /* VALIDAR NOMBRE */

  if (nombre === "") {

    alert("☠️ Escribe tu nombre.");

    nombreInput.focus();

    return;

  }


  /* VALIDAR CÓDIGO */

  if (codigo === "") {

    alert("🔐 Escribe tu código secreto.");

    codigoInput.focus();

    return;

  }


  /* VALIDAR FORMATO */

  if (!/^WEEN\d{4}$/.test(codigo)) {

    alert(
      "🔐 El código debe tener este formato:\n\nWEEN1138"
    );

    codigoInput.focus();

    return;

  }


  btnConfirmar.disabled = true;

  btnConfirmar.textContent =
    "🔎 VERIFICANDO CÓDIGO...";


  /* =================================================
     PRIMERO VERIFICAMOS SI YA FUE UTILIZADO
  ================================================= */

  verificarCodigo(
    codigo,
    function(resultado) {

      /* ERROR DE VERIFICACIÓN */

      if (resultado.error) {

        alert(
          "⚠️ No se pudo verificar el código.\n\n" +
          "Intenta nuevamente."
        );

        btnConfirmar.disabled = false;

        btnConfirmar.textContent =
          "✅ CONFIRMAR";

        return;

      }


      /* CÓDIGO BLOQUEADO */

      if (resultado.bloqueado) {

        mostrarBloqueado(
          nombre,
          codigo
        );

        btnConfirmar.disabled = false;

        btnConfirmar.textContent =
          "✅ CONFIRMAR";

        return;

      }


      /* =================================================
         CÓDIGO DISPONIBLE
      ================================================= */

      btnConfirmar.textContent =
        "⏳ GUARDANDO...";


      const datos =
        new URLSearchParams();


      datos.append(
        "nombre",
        nombre
      );


      datos.append(
        "codigo",
        codigo
      );


      datos.append(
        "confirmacion",
        tipoConfirmacion
      );


      fetch(
        URL_REGISTRO,
        {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },

          body:
            datos.toString()
        }
      )

      .then(
        function() {

          mostrarResultado();

        }
      )

      .catch(
        function(error) {

          console.error(error);

          alert(
            "⚠️ Ocurrió un problema al enviar."
          );

          btnConfirmar.disabled = false;

          btnConfirmar.textContent =
            "✅ CONFIRMAR";

        }
      );

    }
  );

});


/* =====================================================
   RESULTADO
===================================================== */

function mostrarResultado() {

  formulario.style.display = "none";

  bloqueado.style.display = "none";


  if (tipoConfirmacion === "Sí") {

    resultadoExito.style.display =
      "block";

    resultadoNo.style.display =
      "none";

  } else {

    resultadoNo.style.display =
      "block";

    resultadoExito.style.display =
      "none";

  }


  btnConfirmar.disabled = false;

  btnConfirmar.textContent =
    "✅ CONFIRMAR";

}

</script>
